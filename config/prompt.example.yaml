version: 1
default_profile: wechat

profiles:
  wechat:
    system_prompt:
      zh: |
        <SYSTEM_PROMPT_PLACEHOLDER_ZH>
      en: |
        <SYSTEM_PROMPT_PLACEHOLDER_EN>
    user_prompt_template:
      zh: |
        [Context]
        user_id: {user_id}
        {context_block}

        [User Message]
        {user_text}
      en: |
        [Context]
        user_id: {user_id}
        {context_block}

        [User Message]
        {user_text}

  wechat_tool_planner:
    system_prompt:
      zh: |
        <TOOL_PLANNER_SYSTEM_PROMPT_PLACEHOLDER_ZH>
      en: |
        <TOOL_PLANNER_SYSTEM_PROMPT_PLACEHOLDER_EN>
    user_prompt_template:
      zh: |
        [Available Tools]
        {tools_json}

        [Context]
        user_id: {user_id}
        {context_block}

        [User Message]
        {user_text}

        [Instruction]
        仅输出一个 JSON 对象，不要输出解释。
      en: |
        [Available Tools]
        {tools_json}

        [Context]
        user_id: {user_id}
        {context_block}

        [User Message]
        {user_text}

        [Instruction]
        Return one JSON object only.

  wechat_tool_final:
    system_prompt:
      zh: |
        <TOOL_FINAL_SYSTEM_PROMPT_PLACEHOLDER_ZH>
      en: |
        <TOOL_FINAL_SYSTEM_PROMPT_PLACEHOLDER_EN>
    user_prompt_template:
      zh: |
        [Context]
        user_id: {user_id}
        {context_block}

        [User Message]
        {user_text}

        [Tool Call]
        {tool_call_json}

        [Tool Result]
        {tool_result_json}
      en: |
        [Context]
        user_id: {user_id}
        {context_block}

        [User Message]
        {user_text}

        [Tool Call]
        {tool_call_json}

        [Tool Result]
        {tool_result_json}

  default:
    system_prompt:
      zh: |
        <DEFAULT_SYSTEM_PROMPT_PLACEHOLDER_ZH>
      en: |
        <DEFAULT_SYSTEM_PROMPT_PLACEHOLDER_EN>
    user_prompt_template:
      zh: |
        {user_text}
      en: |
        {user_text}

guardrail:
  enabled: true
  max_output_chars: 900
  blocked_input_patterns:
    - "(?i)<INPUT_BLOCK_PATTERN>"
  blocked_output_patterns:
    - "(?i)<OUTPUT_BLOCK_PATTERN>"
  redaction_patterns:
    - "(?i)<REDACT_PATTERN>"
  redaction_replacement:
    zh: "[REDACTED]"
    en: "[REDACTED]"
  blocked_response:
    zh: "<BLOCKED_RESPONSE_PLACEHOLDER_ZH>"
    en: "<BLOCKED_RESPONSE_PLACEHOLDER_EN>"
  fallback_response:
    zh: "<FALLBACK_RESPONSE_PLACEHOLDER_ZH>"
    en: "<FALLBACK_RESPONSE_PLACEHOLDER_EN>"
  trim_suffix:
    zh: "..."
    en: "..."
