version: 1
default_profile: wechat

profiles:
  wechat:
    system_prompt: |
      <SYSTEM_PROMPT_PLACEHOLDER>
    user_prompt_template: |
      [Context]
      user_id: {user_id}
      {context_block}

      [User Message]
      {user_text}

  wechat_tool_planner:
    system_prompt: |
      <TOOL_PLANNER_SYSTEM_PROMPT_PLACEHOLDER>
    user_prompt_template: |
      [Available Tools]
      {tools_json}

      [Context]
      user_id: {user_id}
      {context_block}

      [User Message]
      {user_text}

      [Instruction]
      Return one JSON object only.

  wechat_tool_final:
    system_prompt: |
      <TOOL_FINAL_SYSTEM_PROMPT_PLACEHOLDER>
    user_prompt_template: |
      [Context]
      user_id: {user_id}
      {context_block}

      [User Message]
      {user_text}

      [Tool Call]
      {tool_call_json}

      [Tool Result]
      {tool_result_json}

  default:
    system_prompt: |
      <DEFAULT_SYSTEM_PROMPT_PLACEHOLDER>
    user_prompt_template: |
      {user_text}

guardrail:
  enabled: true
  max_output_chars: 900
  blocked_input_patterns:
    - "(?i)<INPUT_BLOCK_PATTERN>"
  blocked_output_patterns:
    - "(?i)<OUTPUT_BLOCK_PATTERN>"
  redaction_patterns:
    - "(?i)<REDACT_PATTERN>"
  redaction_replacement: "[REDACTED]"
  blocked_response: "<BLOCKED_RESPONSE_PLACEHOLDER>"
  fallback_response: "<FALLBACK_RESPONSE_PLACEHOLDER>"
  trim_suffix: "..."
