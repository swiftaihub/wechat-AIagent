questionnaire:
  enabled: true
  auto_collapse_on_submit: true
  title:
    zh: 快速了解你的需求
    en: Quick intake
  description:
    zh: 把最近的状态、偏好或送礼方向交给 AI，它会更容易把推荐收得更准。
    en: Give the assistant a quick sense of your current needs so it can narrow recommendations more clearly.
  submit_button:
    zh: 提交并开始推荐
    en: Submit and guide me
  reset_button:
    zh: 重置
    en: Reset
  submit_notice:
    zh: 基础信息已提交，正在整理更贴近你的推荐方向。
    en: Information submitted. Shaping a more tailored recommendation path now.
  fields:
    - name: use_case
      type: single
      required: true
      full_width: true
      ui_variant: spotlight-grid
      label:
        zh: 此次想解决什么
        en: What brings you here
      helper_text:
        zh: 先选一个最接近的方向，AI 会只展开与你这次目的相关的问题。
        en: Choose the closest path and the helper will only open the questions that fit this visit.
      importance:
        default: 5
      options:
        - value: daily_wellness
          label:
            zh: 日常养护
            en: Daily wellness
          eyebrow:
            zh: Everyday ritual
            en: Everyday ritual
          description:
            zh: 想找一款适合日常喝、节奏温和、容易长期坚持的草本茶。
            en: Find a tea that feels gentle, steady, and easy to enjoy as part of your daily rhythm.
        - value: recent_discomfort_guidance
          label:
            zh: 最近状态与不适
            en: Recent discomfort guidance
          eyebrow:
            zh: Need-based
            en: Need-based
          description:
            zh: 最近更明显地觉得累、燥、沉、紧，想更快缩小适合的产品方向。
            en: Narrow the right direction faster when fatigue, dryness, heaviness, or tension feels more noticeable lately.
        - value: gifting
          label:
            zh: 送礼挑选
            en: Gifting
          eyebrow:
            zh: Gift-ready
            en: Gift-ready
          description:
            zh: 想替家人、朋友或客户挑一款体面、接受度高、入口舒服的茶礼。
            en: Choose something elegant, easy to enjoy, and polished enough to give with confidence.
        - value: ingredient_learning
          label:
            zh: 想了解原料
            en: Ingredient learning
          eyebrow:
            zh: Ingredient focus
            en: Ingredient focus
          description:
            zh: 想先看看某款茶用了哪些原料，它们各自是什么风格与作用方向。
            en: Explore what is inside a tea first and understand the role and character of its key ingredients.
        - value: article_recommendation
          label:
            zh: 想看文章内容
            en: Article recommendation
          eyebrow:
            zh: Learn first
            en: Learn first
          description:
            zh: 想先通过内容了解调养思路、饮用场景或草本知识，再决定看哪款茶。
            en: Start with reading and learn about rituals, ingredients, and wellness direction before choosing a tea.
    - name: recent_discomfort_multi
      type: multi
      required: false
      full_width: true
      label:
        zh: 最近更明显的状态
        en: What feels most noticeable lately
      importance:
        default: 5
      show_if:
        use_case: recent_discomfort_guidance
      options:
        - value: fatigue
          label:
            zh: 容易累、恢复慢
            en: Fatigue and slow recovery
        - value: dryness_after_late_nights
          label:
            zh: 熬夜后口干、偏燥
            en: Dryness after late nights
        - value: heavy_after_meals
          label:
            zh: 饭后困、身体沉
            en: Heavy after meals
        - value: mood_tension
          label:
            zh: 郁闷、紧绷、想放松一点
            en: Mood tension and wanting to unwind
    - name: selected_product_slug
      type: single
      required: true
      label:
        zh: 选择产品
        en: Choose a product
      placeholder:
        zh: 请选择想了解原料的产品
        en: Select the product whose ingredients you want to explore
      ui_variant: dropdown
      importance:
        default: 5
      show_if:
        use_case: ingredient_learning
      options_from:
        source: product_catalog
    - name: free_text_recent_discomfort
      type: text
      required: false
      full_width: true
      label:
        zh: 还有什么想补充
        en: Anything else you want to add
      show_if:
        use_case:
          - daily_wellness
          - recent_discomfort_guidance
          - gifting
          - article_recommendation
