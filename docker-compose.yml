version: "3.9"

services:
  wechat-mp:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wechat-mp
    image: wechat-mp:latest
    env_file:
      - .env
    volumes:
      - ./config:/srv/config:ro
    ports:
      - "${WEBUI_HOST_BIND:-127.0.0.1}:${WEBUI_HOST_PORT:-8788}:8787"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8787/health', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared
    command: tunnel run openclaw-wechat-mp
    depends_on:
      - wechat-mp
    volumes:
      - ./cloudflared/config.yml:/etc/cloudflared/config.yml:ro
      - ./cloudflared/credentials.json:/etc/cloudflared/credentials.json:ro
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
